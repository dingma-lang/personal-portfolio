<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="title desc"><title id="title">January visit changes, 2025 to 2026</title><desc id="desc">Focus areas and university points of interest increased 0.32 percent. Other Boston and Cambridge points of interest increased 0.31 percent.</desc><rect width="760" height="352" fill="#eaeaf5"/><g font-family="Arial,sans-serif" fill="#53526e" font-size="14"><text x="54" y="38">TOTAL VISIT CHANGE · JAN 2025 → JAN 2026</text><text x="54" y="110">Focus areas + university POIs</text><text x="54" y="210">Other Boston / Cambridge</text><text x="54" y="322">Almost identical growth across the two groups.</text></g><rect x="54" y="127" width="540" height="30" rx="3" fill="#5b528f"/><rect x="54" y="227" width="523.125" height="30" rx="3" fill="#a29cbd"/><g font-family="Arial,sans-serif" font-weight="bold" font-size="24" fill="#433b6d"><text x="610" y="152">+0.32%</text><text x="593" y="252">+0.31%</text></g></svg>